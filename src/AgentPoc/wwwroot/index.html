<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPoc Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232f6fed%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
  --accent: #2f6fed; --accent-text: #ffffff; --user: #e8f0fe; --ok: #1a7f4b; --fail: #c0392b;
  --warn: #9a6700; --code: #f1f3f6; --activity: #fafbfc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b23; --text: #e6e8ec; --muted: #9aa3b2; --border: #2a303b;
    --accent: #5b8cff; --accent-text: #0b0e13; --user: #1f2a44; --ok: #4cc38a; --fail: #ff6b5b;
    --warn: #e3b341; --code: #11151c; --activity: #131820;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --panel: #171b23; --text: #e6e8ec; --muted: #9aa3b2; --border: #2a303b;
  --accent: #5b8cff; --accent-text: #0b0e13; --user: #1f2a44; --ok: #4cc38a; --fail: #ff6b5b;
  --warn: #e3b341; --code: #11151c; --activity: #131820;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
.app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.new { padding: 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
.new select { flex: 1; min-width: 0; padding: 6px; }
.convs { overflow-y: auto; flex: 1; }
.conv { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.conv:hover, .conv.active { background: var(--user); }
.conv .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .m { color: var(--muted); font-size: 12px; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 12px; }
header .title { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .stats { color: var(--muted); font-size: 13px; white-space: nowrap; }
#menu { display: none; }
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.user { align-self: flex-end; background: var(--user); padding: 10px 14px; border-radius: 14px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
.turn { display: flex; flex-direction: column; gap: 8px; }
.text { overflow-wrap: anywhere; }
.text p { margin: .4em 0; }
.text pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; }
.text code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.text pre code { background: none; padding: 0; }
.text a { color: var(--accent); }
details.activity { background: var(--activity); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
details.activity summary { padding: 6px 10px; color: var(--muted); cursor: pointer; }
.rows { padding: 2px 10px 8px; display: flex; flex-direction: column; gap: 3px; }
.row { color: var(--muted); overflow-wrap: anywhere; }
.row .name { color: var(--text); font-family: ui-monospace, Menlo, monospace; }
.row.ok .st { color: var(--ok); } .row.fail .st { color: var(--fail); }
.row.deleg { color: var(--accent); }
.row details summary { cursor: pointer; }
.row pre { white-space: pre-wrap; background: var(--code); padding: 6px; border-radius: 6px; max-height: 220px; overflow: auto; margin: 4px 0; }
.agent { font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--border); margin-right: 4px; }
.plan { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--panel); font-size: 14px; }
.plan .h { font-weight: 600; font-size: 13px; color: var(--muted); }
.plan .done { text-decoration: line-through; color: var(--muted); }
.plan .doing { font-weight: 600; }
.approval { border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
.approval .q { font-weight: 600; color: var(--warn); }
.approval pre { white-space: pre-wrap; background: var(--code); padding: 6px; border-radius: 6px; }
.approval .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.approval textarea, .approval input { width: 100%; margin: 6px 0; padding: 6px 8px; font-size: 13px; }
.approval textarea.args { font-family: ui-monospace, Menlo, monospace; }
.approval .why, .approval .hint { color: var(--muted); font-size: 12px; }
.approval .options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.banner button { margin-left: 8px; }
.error { color: var(--fail); }
.footer { color: var(--muted); font-size: 12px; }
.banner { color: var(--warn); font-size: 13px; text-align: center; }
form { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px; }
.composer { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; padding: 10px; min-height: 44px; max-height: 200px; }
.empty { color: var(--muted); text-align: center; margin-top: 15vh; }
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 30% 0 0; z-index: 10; display: none; }
  aside.open { display: flex; }
  #menu { display: inline-block; }
  .messages, header, form { padding-left: 16px; padding-right: 16px; }
  .user { max-width: 92%; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="new">
      <select id="agentSelect" aria-label="Agente"></select>
      <button class="primary" id="newBtn">Nova</button>
    </div>
    <div class="convs" id="convs"></div>
  </aside>
  <main>
    <header>
      <button id="menu" aria-label="Conversas">☰</button>
      <div class="title" id="title">AgentPoc</div>
      <div class="stats" id="stats"></div>
    </header>
    <div class="messages" id="messages"><div class="inner" id="inner"><div class="empty">Crie ou escolha uma conversa.</div></div></div>
    <form id="form">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Mensagem (Enter envia, Shift+Enter quebra linha)" disabled></textarea>
        <button class="primary" id="sendBtn" type="submit" disabled>Enviar</button>
        <button id="stopBtn" type="button" hidden>Parar</button>
      </div>
    </form>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const state = { conv: null, running: false };
const SILENT_TOOLS = new Set(["think", "update_plan", "delegate_task"]);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}

function markdown(src) {
  const parts = String(src ?? "").split(/```[^\n]*\n?/);
  return parts.map((part, i) => {
    if (i % 2 === 1) return `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`;
    const out = [];
    let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const raw of esc(part).split("\n")) {
      const line = raw.trimEnd();
      let m;
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { close(); out.push(`<h${m[1].length + 2}>${inlineMd(m[2])}</h${m[1].length + 2}>`); }
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inlineMd(m[1])}</li>`); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inlineMd(m[1])}</li>`); }
      else if (line.trim() === "") { close(); }
      else { close(); out.push(`<p>${inlineMd(line)}</p>`); }
    }
    close();
    return out.join("");
  }).join("");
}

async function api(path, options = {}) {
  const resp = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).error || `HTTP ${resp.status}`);
  return resp.status === 204 ? null : resp.json().catch(() => null);
}

function money(v) { return `US$ ${Number(v || 0).toFixed(4)}`; }

function setRunning(on) {
  state.running = on;
  $("input").disabled = on || !state.conv;
  $("sendBtn").disabled = on || !state.conv;
  $("stopBtn").hidden = !on;
}

async function loadAgents() {
  const agents = await api("/api/agents");
  $("agentSelect").innerHTML = agents.map(a => `<option value="${esc(a.id)}" ${a.id === "assistant" ? "selected" : ""}>${esc(a.id)}</option>`).join("");
}

async function loadConversations() {
  const list = await api("/api/conversations");
  $("convs").innerHTML = list.map(c => `
    <div class="conv ${state.conv === c.id ? "active" : ""}" data-id="${c.id}">
      <div class="t">${esc(c.title || "(nova conversa)")}</div>
      <div class="m">${esc(c.agent)} · ${new Date(c.updated_at).toLocaleString("pt-BR")}${c.busy ? " · em andamento" : ""}</div>
    </div>`).join("");
  for (const el of document.querySelectorAll(".conv")) el.onclick = () => openConversation(el.dataset.id);
}

// ---------- renderizacao de um turno do assistente ----------

function newTurn() {
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.innerHTML = `<details class="activity" open><summary>Atividade</summary><div class="rows"></div></details>`;
  $("inner").appendChild(turn);
  return { el: turn, rows: turn.querySelector(".rows"), activity: turn.querySelector(".activity"), text: null, buffer: "", count: 0, plan: null, calls: [] };
}

function agentTag(evt) { return evt.depth > 0 ? `<span class="agent">${esc(evt.agent)}</span>` : ""; }

function addRow(t, html, cls = "") {
  const row = document.createElement("div");
  row.className = "row " + cls;
  row.style.paddingLeft = `${(t.depthHint || 0) * 16}px`;
  row.innerHTML = html;
  t.rows.appendChild(row);
  t.count++;
  t.activity.querySelector("summary").textContent = `Atividade (${t.count})`;
  t.text = null;
  scrollDown();
  return row;
}

function appendText(t, delta) {
  if (!t.text) {
    t.text = document.createElement("div");
    t.text.className = "text";
    t.el.appendChild(t.text);
    t.buffer = "";
  }
  t.buffer += delta;
  t.text.innerHTML = markdown(t.buffer);
  scrollDown();
}

function renderPlan(t, steps) {
  if (!t.plan) {
    t.plan = document.createElement("div");
    t.plan.className = "plan";
    t.el.insertBefore(t.plan, t.activity.nextSibling);
  }
  const mark = s => s === "done" ? "☑" : s === "in_progress" ? "◐" : "☐";
  const cls = s => s === "done" ? "done" : s === "in_progress" ? "doing" : "";
  t.plan.innerHTML = `<div class="h">Plano</div>` + steps.map(s => `<div class="${cls(s.status)}">${mark(s.status)} ${esc(s.step)}</div>`).join("");
}

function realClick(e) { return e.isTrusted && e.detail !== 0; } // so clique de mouse: nunca decidir por script ou tecla Enter

function renderApproval(t, evt) {
  const card = document.createElement("div");
  card.className = "approval";
  const hint = evt.durable
    ? "A conversa fica pausada até você decidir; pode fechar a página e voltar depois."
    : "Um subagente está esperando esta decisão (até 10 minutos).";
  if (evt.kind === "question") {
    const options = (evt.options || []).map(o => `<button type="button" class="opt">${esc(o)}</button>`).join("");
    card.innerHTML = `
      <div class="q">${agentTag(evt)}❓ ${esc(evt.question)}</div>
      ${options ? `<div class="options">${options}</div>` : ""}
      <textarea class="answer" rows="2" placeholder="Sua resposta"></textarea>
      <div class="actions"><button type="button" class="primary" data-act="answer">Responder</button></div>
      <div class="hint">${hint}</div>`;
    for (const o of card.querySelectorAll(".opt")) o.onclick = e => realClick(e) && decide(card, evt, { answer: o.textContent }, `Respondido: ${o.textContent}`);
    card.querySelector("[data-act=answer]").onclick = e => {
      const answer = card.querySelector(".answer").value.trim();
      if (realClick(e) && answer) decide(card, evt, { answer }, `Respondido: ${answer}`);
    };
  } else {
    const original = JSON.stringify(evt.args, null, 2);
    card.innerHTML = `
      <div class="q">${agentTag(evt)}O agente quer executar <code>${esc(evt.tool)}</code>. Aprovar?</div>
      ${evt.policy_reason ? `<div class="why">Por que pede aprovação: ${esc(evt.policy_reason)}</div>` : ""}
      <textarea class="args" rows="${Math.min(8, original.split("\n").length + 1)}" spellcheck="false" aria-label="Argumentos (editáveis)">${esc(original)}</textarea>
      <input class="reason" placeholder="Motivo ou observação (opcional; o agente recebe)">
      <div class="actions"><button type="button" class="primary" data-act="approve">Aprovar</button><button type="button" data-act="deny">Negar</button></div>
      <div class="hint">Você pode corrigir os argumentos antes de aprovar. ${hint}</div>`;
    card.querySelector("[data-act=approve]").onclick = e => {
      if (!realClick(e)) return;
      const text = card.querySelector(".args").value;
      let args;
      try { args = JSON.parse(text); } catch { card.querySelector(".hint").textContent = "Argumentos não são um JSON válido."; return; }
      const edited = JSON.stringify(args, null, 2) !== original;
      const reason = card.querySelector(".reason").value.trim() || null;
      decide(card, evt, { approved: true, reason, args: edited ? args : null }, edited ? "Aprovado com argumentos editados." : "Aprovado.");
    };
    card.querySelector("[data-act=deny]").onclick = e => {
      if (!realClick(e)) return;
      const reason = card.querySelector(".reason").value.trim() || null;
      decide(card, evt, { approved: false, reason }, reason ? `Negado: ${reason}` : "Negado.");
    };
  }
  (t?.el || $("inner")).appendChild(card);
  scrollDown();
}

async function decide(card, evt, payload, label) {
  const controls = card.querySelectorAll("button, textarea, input");
  controls.forEach(x => x.disabled = true);
  const resp = await fetch(`/api/approvals/${evt.approval_id}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
  });
  if (!resp.ok) {
    card.querySelector(".hint").textContent = "Erro: " + ((await resp.json().catch(() => ({}))).error || `HTTP ${resp.status}`);
    controls.forEach(x => x.disabled = false);
    return;
  }
  card.querySelector(".actions").textContent = label;
  card.querySelectorAll(".options, textarea, input").forEach(x => x.remove());
  if ((resp.headers.get("content-type") || "").includes("text/event-stream")) await runStream(resp);
}

function handleEvent(t, type, evt) {
  t.depthHint = evt.depth || 0;
  const who = agentTag(evt);
  switch (type) {
    case "text": appendText(t, evt.delta); break;
    case "reasoning": addRow(t, `💭 ${esc(evt.delta)}`); break;
    case "thinking": addRow(t, `${who}💭 ${esc(evt.thought)}`); break;
    case "plan_updated": renderPlan(t, evt.steps || []); break;
    case "tools_loaded": addRow(t, `${who}🔎 descobriu: ${esc((evt.tools || []).join(", ") || "nada novo")}`); break;
    case "delegation_start": addRow(t, `${who}→ delegou para <b>${esc(evt.to_agent)}</b>: ${esc(evt.task)}`, "deleg"); break;
    case "delegation_end": addRow(t, `${who}← <b>${esc(evt.to_agent)}</b> terminou (${esc(evt.status)}, ${evt.tokens} tokens)`, "deleg"); break;
    case "task_created": addRow(t, `${who}📋 tarefa em segundo plano para <b>${esc(evt.agent)}</b> <code>${esc(evt.task_id)}</code>`); break;
    case "policy": addRow(t, `${who}🛡 ${esc(evt.tool)}: <b>${esc(evt.decision)}</b> (${esc(evt.reason)})`, evt.decision === "approved" ? "ok" : "fail"); break;
    case "approval_request": renderApproval(t, evt); break;
    case "budget_exceeded": addRow(t, `${who}budget esgotado (${evt.used}/${evt.limit})`, "fail"); break;
    case "error": addRow(t, `${who}erro: ${esc(evt.message)}`, "fail"); break;
    case "cancelled": addRow(t, `${who}cancelado`, "fail"); break;
    case "llm_call": state.liveTokens += (evt.input_tokens || 0) + (evt.output_tokens || 0); state.liveCost += Number(evt.cost_usd || 0); renderStats(); break;
    case "tool_call":
      if (SILENT_TOOLS.has(evt.name)) break;
      t.calls.push(addRow(t, `${who}⚙ <span class="name">${esc(evt.name)}</span>(${esc(JSON.stringify(evt.args)).slice(0, 300)}) <span class="st">…</span>`));
      break;
    case "tool_result": {
      if (SILENT_TOOLS.has(evt.name)) break;
      const row = t.calls.shift();
      if (!row) break;
      row.classList.add(evt.ok ? "ok" : "fail");
      row.querySelector(".st").innerHTML = `${evt.ok ? "✓" : "✗"} ${evt.ms}ms <details><summary>resultado</summary><pre>${esc(evt.output)}</pre></details>`;
      break;
    }
    case "waiting_human": break;
    case "run_resumed": addRow(t, "▶ retomado com a sua decisão"); break;
    case "done":
      if (evt.status === "waiting_human") {
        addRow(t, "⏸ pausado esperando a sua decisão acima");
        t.activity.open = false;
        break;
      }
      for (const actions of t.el.querySelectorAll(".approval .actions")) {
        if (actions.querySelector("button")) actions.textContent = "Sem decisão: o turno terminou.";
      }
      if (!t.buffer && evt.output) appendText(t, evt.output);
      if (evt.status !== "completed") addRow(t, `turno terminou como <b>${esc(evt.status)}</b>`, "fail");
      t.activity.open = false;
      { const f = document.createElement("div"); f.className = "footer"; f.textContent = `${evt.status} · ${evt.steps} passos · ${evt.tokens} tokens · ${money(evt.cost_usd)}`; t.el.appendChild(f); }
      break;
    case "failed": addRow(t, `<span class="error">${esc(evt.error)}</span>`, "fail"); break;
  }
}

// ---------- historico persistido ----------

function renderHistory(conv) {
  const inner = $("inner");
  inner.innerHTML = "";
  if (conv.summary) inner.insertAdjacentHTML("beforeend", `<details class="activity"><summary>Resumo dos turnos antigos (compactados)</summary><div class="rows"><div class="text">${markdown(conv.summary)}</div></div></details>`);
  let t = null;
  const results = new Map(conv.messages.filter(m => m.role === "tool").map(m => [m.tool_call_id, m]));
  for (const m of conv.messages) {
    if (m.role === "user") {
      t = null;
      inner.insertAdjacentHTML("beforeend", `<div class="user">${esc(m.content)}</div>`);
    } else if (m.role === "assistant") {
      t = t || newTurn();
      t.activity.open = false;
      for (const c of m.tool_calls || []) {
        const r = results.get(c.id);
        const ok = r && !/^(ERRO|NEGADO|BLOQUEADO|CANCELADO|INTERROMPIDO)/.test(r.content || "");
        addRow(t, `⚙ <span class="name">${esc(c.name)}</span>(${esc(c.arguments).slice(0, 300)}) <span class="st">${r ? (ok ? "✓" : "✗") : ""} <details><summary>resultado</summary><pre>${esc(r?.content)}</pre></details></span>`, ok ? "ok" : "fail");
        if (c.name === "update_plan") { try { renderPlan(t, JSON.parse(c.arguments).steps || []); } catch { } }
      }
      if (m.content) appendText(t, m.content);
    }
  }
  if (!t && !conv.messages.length) inner.innerHTML = `<div class="empty">Conversa nova com <b>${esc(conv.agent)}</b>. Pergunte qualquer coisa.</div>`;
  for (const p of conv.pending_approvals || []) renderApproval(null, { ...p, depth: 0 });
  if (conv.busy) inner.insertAdjacentHTML("beforeend", `<div class="banner">Um turno ainda está rodando no servidor. Atualizando…</div>`);
  else if (conv.waiting?.ready_to_resume) {
    inner.insertAdjacentHTML("beforeend", `<div class="banner">A decisão já foi tomada e o turno está pronto para continuar.<button class="primary" id="resumeBtn">Continuar</button></div>`);
    $("resumeBtn").onclick = async e => {
      if (!realClick(e)) return;
      e.target.closest(".banner").remove();
      await runStream(await fetch(`/api/conversations/${conv.id}/resume`, { method: "POST" }));
    };
  }
  updatePlaceholder(conv);
  scrollDown();
}

function updatePlaceholder(conv) {
  $("input").placeholder = (conv.pending_approvals || []).some(p => p.durable)
    ? "Decida o pedido acima, ou envie outra mensagem para descartá-lo"
    : "Mensagem (Enter envia, Shift+Enter quebra linha)";
}

function renderStats() {
  const c = state.convData;
  if (!c) return;
  $("stats").textContent = `${c.agent} · ${(c.tokens + state.liveTokens).toLocaleString("pt-BR")} tokens · ${money(c.cost_usd + state.liveCost)} · ${c.active_tools.length} tools ativas`;
}

async function openConversation(id) {
  state.conv = id;
  state.liveTokens = 0; state.liveCost = 0;
  const conv = await api(`/api/conversations/${id}`);
  state.convData = conv;
  $("title").textContent = conv.title || "Nova conversa";
  renderStats();
  renderHistory(conv);
  setRunning(conv.busy);
  $("sidebar").classList.remove("open");
  await loadConversations();
  if (conv.busy) setTimeout(() => state.conv === id && openConversation(id), 2000);
  else $("input").focus();
}

async function send(text) {
  $("inner").querySelector(".empty")?.remove();
  $("inner").insertAdjacentHTML("beforeend", `<div class="user">${esc(text)}</div>`);
  updatePlaceholder({});
  await runStream(fetch(`/api/conversations/${state.conv}/messages`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text })
  }));
}

/** Consome um turno em SSE (mensagem nova, decisao que retoma o turno ou botao Continuar). */
async function runStream(respOrPromise) {
  const id = state.conv;
  const t = newTurn();
  setRunning(true);
  try {
    const resp = await respOrPromise;
    if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).error || `HTTP ${resp.status}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        const type = (block.match(/^event: (.*)$/m) || [])[1];
        const data = (block.match(/^data: (.*)$/m) || [])[1];
        if (type && data) handleEvent(t, type, JSON.parse(data));
      }
    }
  } catch (e) {
    handleEvent(t, "failed", { error: e.message });
  } finally {
    setRunning(false);
    if (state.conv === id) {
      state.convData = await api(`/api/conversations/${id}`);
      state.liveTokens = 0; state.liveCost = 0;
      $("title").textContent = state.convData.title || "Nova conversa";
      renderStats();
      updatePlaceholder(state.convData);
      loadConversations();
      $("input").focus();
    }
  }
}

function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }

$("newBtn").onclick = async () => {
  const { id } = await api("/api/conversations", { method: "POST", body: JSON.stringify({ agent: $("agentSelect").value }) });
  await openConversation(id);
};
$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || state.running || !state.conv) return;
  $("input").value = "";
  $("input").style.height = "";
  send(text);
};
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", e => { e.target.style.height = ""; e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px"; });
$("stopBtn").onclick = () => api(`/api/conversations/${state.conv}/cancel`, { method: "POST" }).catch(() => {});
$("menu").onclick = () => $("sidebar").classList.toggle("open");

(async () => {
  await loadAgents();
  await loadConversations();
  const first = document.querySelector(".conv");
  if (first) openConversation(first.dataset.id);
})();
</script>
